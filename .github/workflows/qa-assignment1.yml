name: qa-assignment1

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  qa-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install QA dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare QA environment file
        run: cp .env.qa.example .env.qa

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run backend Go tests (informational baseline)
        continue-on-error: true
        working-directory: backend
        run: GOCACHE=/tmp/go-build GOMODCACHE=/tmp/go-mod go test ./...

      - name: Run Assignment 1 smoke tests
        run: npm run qa:test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
